# Continuous integration: runs backend tests and builds the frontend on every push / pull request.
# No AWS credentials are used. Add a deploy job later (Amplify can also deploy straight from GitHub).
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci || npm install
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: npm run build:lambdas
        working-directory: backend
      - run: npm ci || npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
